<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE FOURWORD</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>

    <header>
        <h1 id="game-title">THE FOURWORD</h1>
    </header>

    <div class="seed-bank" id="seed-bank">
        </div>

    <main>
        <div class="grid-container" id="game-grid">
            <input class="cell" maxlength="1" data-row="0" data-col="0">
            <input class="cell" maxlength="1" data-row="0" data-col="1">
            <input class="cell" maxlength="1" data-row="0" data-col="2">
            <input class="cell" maxlength="1" data-row="0" data-col="3">

            <input class="cell" maxlength="1" data-row="1" data-col="0">
            <div class="cell invisible-space"></div>
            <div class="cell invisible-space"></div>
            <input class="cell" maxlength="1" data-row="1" data-col="3">

            <input class="cell" maxlength="1" data-row="2" data-col="0">
            <div class="cell invisible-space"></div>
            <div class="cell invisible-space"></div>
            <input class="cell" maxlength="1" data-row="2" data-col="3">

            <input class="cell" maxlength="1" data-row="3" data-col="0">
            <input class="cell" maxlength="1" data-row="3" data-col="1">
            <input class="cell" maxlength="1" data-row="3" data-col="2">
            <input class="cell" maxlength="1" data-row="3" data-col="3">
        </div>

        <div style="text-align: center;">
            <button id="submit-btn">ENTER</button>
        </div>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
